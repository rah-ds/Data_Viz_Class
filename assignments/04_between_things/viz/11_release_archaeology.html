<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>11 — Release Year Archaeology</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: "Helvetica Neue", sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
  h1 { font-size: 1.4rem; color: #58a6ff; margin-bottom: .2rem; }
  p.sub { color: #8b949e; font-size: .85rem; margin-bottom: 1rem; max-width: 750px; text-align: center; }
  svg { background: #161b22; border-radius: 8px; }
  .tooltip { position: absolute; background: #1c2128; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; font-size: .75rem; color: #c9d1d9; pointer-events: none; opacity: 0; line-height: 1.5; }
  a.back { color: #58a6ff; font-size: .8rem; margin-bottom: 1rem; text-decoration: none; }
  .stat-row { display: flex; gap: 2rem; margin-bottom: 1rem; }
  .stat { text-align: center; }
  .stat .num { font-size: 1.6rem; color: #58a6ff; font-weight: bold; }
  .stat .label { font-size: .7rem; color: #8b949e; }
</style>
</head>
<body>
<a class="back" href="index.html">← all visualizations</a>
<h1>Release Year Archaeology</h1>
<p class="sub">When was the music actually released? A histogram of every stream by album release year — revealing whether listeners favor the bleeding edge or dig into the back catalog.</p>
<div class="stat-row" id="stats"></div>
<div id="chart"></div>
<div class="tooltip" id="tip"></div>
<script>
const W = 960, H = 500, M = {top: 30, right: 30, bottom: 50, left: 65};
const w = W - M.left - M.right, h = H - M.top - M.bottom;

const svg = d3.select("#chart").append("svg").attr("width", W).attr("height", H);
const g = svg.append("g").attr("transform", `translate(${M.left},${M.top})`);
const tip = d3.select("#tip");

d3.json("data/release_year_archaeology.json").then(data => {
  data.sort((a,b) => a.release_year - b.release_year);

  const totalStreams = d3.sum(data, d => d.streams);
  const peakYear = data.reduce((a,b) => a.streams > b.streams ? a : b);
  const pre2000 = d3.sum(data.filter(d => d.release_year < 2000), d => d.streams);
  const post2020 = d3.sum(data.filter(d => d.release_year >= 2020), d => d.streams);

  const stats = d3.select("#stats");
  [{num: peakYear.release_year, label: "Peak Year"},
   {num: d3.format(",")(totalStreams), label: "Total Streams"},
   {num: (pre2000/totalStreams*100).toFixed(1)+"%", label: "Pre-2000"},
   {num: (post2020/totalStreams*100).toFixed(1)+"%", label: "2020+"}
  ].forEach(s => {
    const div = stats.append("div").attr("class","stat");
    div.append("div").attr("class","num").text(s.num);
    div.append("div").attr("class","label").text(s.label);
  });

  const x = d3.scaleBand().domain(data.map(d => d.release_year)).range([0, w]).padding(0.15);
  const y = d3.scaleLinear().domain([0, d3.max(data, d => d.streams)]).nice().range([h, 0]);

  // Color by decade
  const decadeColor = d3.scaleOrdinal()
    .domain([1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020])
    .range(["#6e40aa","#bf3caf","#fe4b83","#ff7847","#e2b72f","#aff05b","#52f667","#1ddfa3"]);
  const getDecade = yr => Math.floor(yr / 10) * 10;

  // X axis — show every 5th year
  const xAxis = d3.axisBottom(x).tickValues(data.map(d => d.release_year).filter(y => y % 5 === 0));
  g.append("g").attr("transform", `translate(0,${h})`).call(xAxis)
    .selectAll("text").style("fill","#8b949e").attr("transform","rotate(-45)").attr("text-anchor","end");
  g.append("g").call(d3.axisLeft(y).ticks(8).tickFormat(d3.format(",.0f")))
    .selectAll("text").style("fill","#8b949e");
  g.selectAll(".domain, .tick line").attr("stroke","#30363d");

  svg.append("text").attr("x", M.left + w/2).attr("y", H - 4).attr("text-anchor","middle").attr("fill","#8b949e").attr("font-size","12px").text("Album Release Year");
  svg.append("text").attr("transform","rotate(-90)").attr("x", -(M.top + h/2)).attr("y", 14).attr("text-anchor","middle").attr("fill","#8b949e").attr("font-size","12px").text("Streams");

  g.selectAll("rect.bar")
    .data(data)
    .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.release_year))
    .attr("y", d => y(d.streams))
    .attr("width", x.bandwidth())
    .attr("height", d => h - y(d.streams))
    .attr("fill", d => decadeColor(getDecade(d.release_year)))
    .attr("opacity", 0.85)
    .on("mouseover", (e,d) => {
      tip.style("opacity",1).html(
        `<b>${d.release_year}</b><br>` +
        `${d3.format(",")(d.streams)} streams<br>` +
        `${d.total_hours} hours<br>` +
        `${d.unique_tracks} tracks · ${d.unique_artists} artists`
      );
    })
    .on("mousemove", e => tip.style("left",(e.pageX+12)+"px").style("top",(e.pageY-20)+"px"))
    .on("mouseout", () => tip.style("opacity",0));
});
</script>
</body>
</html>
