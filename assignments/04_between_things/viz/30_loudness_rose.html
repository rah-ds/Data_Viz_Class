<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>30 — The Loudness Rose</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: "Helvetica Neue", sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
  h1 { font-size: 1.6rem; color: #58a6ff; margin-bottom: .2rem; }
  p.sub { color: #8b949e; font-size: .85rem; margin-bottom: 1.2rem; max-width: 700px; text-align: center; }
  svg { background: #161b22; border-radius: 12px; }
  .tooltip { position: absolute; background: #1c2128ee; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; font-size: .75rem; color: #c9d1d9; pointer-events: none; opacity: 0; line-height: 1.6; }
  a.back { color: #58a6ff; font-size: .8rem; margin-bottom: 1rem; text-decoration: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; font-size: .75rem; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .lswatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<a class="back" href="index.html">← all visualizations</a>
<h1>🌹 The Loudness Rose</h1>
<p class="sub">A wind rose for sound — each petal direction is a musical key, and the stacked rings represent loudness ranges from whisper-quiet to ear-splitting. Which keys bloom loudest?</p>
<div id="chart"></div>
<div class="legend" id="legend"></div>
<div class="tooltip" id="tip"></div>
<script>
const W = 740, H = 740, cx = W/2, cy = H/2;
const maxR = 300, innerR = 50;

const svg = d3.select("#chart").append("svg").attr("width",W).attr("height",H);
const defs = svg.append("defs");
const filt = defs.append("filter").attr("id","glow");
filt.append("feGaussianBlur").attr("stdDeviation",2).attr("result","b");
const fm = filt.append("feMerge"); fm.append("feMergeNode").attr("in","b"); fm.append("feMergeNode").attr("in","SourceGraphic");

const g = svg.append("g").attr("transform",`translate(${cx},${cy})`);
const tip = d3.select("#tip");

const keys = ["C","C♯/D♭","D","D♯/E♭","E","F","F♯/G♭","G","G♯/A♭","A","A♯/B♭","B"];
const loudBins = ["<-20dB","-20 to -15","-15 to -10","-10 to -7","-7 to -5","-5 to -3",">-3dB"];
const binColors = ["#161b22","#1a3a5c","#1e6091","#58a6ff","#f0883e","#ff7b72","#da3633"];

d3.json("data/loudness_by_key.json").then(data => {
  const slice = (2*Math.PI)/12;
  const arc = d3.arc();

  // Compute stacked radii per key
  const nested = {};
  keys.forEach((k,i) => { nested[i] = {}; loudBins.forEach(b => nested[i][b] = 0); });
  data.forEach(d => { nested[d.key][d.loud_bin] = d.count; });

  // Find max total for scaling
  const totals = keys.map((_,i) => d3.sum(loudBins.map(b => nested[i][b])));
  const maxTotal = d3.max(totals);
  const rScale = d3.scaleLinear().domain([0, maxTotal]).range([innerR, maxR]);

  // Grid circles
  [0.25,0.5,0.75,1].forEach(p => {
    const r = innerR + (maxR - innerR)*p;
    g.append("circle").attr("r",r).attr("fill","none").attr("stroke","#21262d").attr("stroke-dasharray","2,4");
  });

  // Draw stacked arcs per key
  keys.forEach((kName, ki) => {
    let cumCount = 0;
    loudBins.forEach((bin, bi) => {
      const count = nested[ki][bin];
      if (count === 0) return;
      const r0 = rScale(cumCount);
      const r1 = rScale(cumCount + count);
      cumCount += count;

      g.append("path")
        .attr("d", arc({
          innerRadius: r0,
          outerRadius: r1,
          startAngle: slice * ki - slice * 0.42,
          endAngle: slice * ki + slice * 0.42,
        }))
        .attr("fill", binColors[bi])
        .attr("stroke","#0d1117").attr("stroke-width",0.5)
        .attr("opacity",0.85)
        .attr("filter","url(#glow)")
        .on("mouseover",(e) => {
          tip.style("opacity",1).html(
            `<b>${kName}</b> — ${bin}<br>`+
            `${d3.format(",")(count)} streams<br>`+
            `${(count/totals[ki]*100).toFixed(1)}% of key total`);
        })
        .on("mousemove",e=>tip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-20)+"px"))
        .on("mouseout",()=>tip.style("opacity",0));
    });
  });

  // Key labels
  keys.forEach((k, i) => {
    const a = slice * i;
    const r = maxR + 24;
    g.append("text")
      .attr("x", Math.sin(a)*r).attr("y", -Math.cos(a)*r)
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("fill","#c9d1d9").attr("font-size","12px").attr("font-weight","bold")
      .text(k);
  });

  // Spoke lines
  keys.forEach((_, i) => {
    const a = slice * i;
    g.append("line")
      .attr("x1",Math.sin(a)*innerR).attr("y1",-Math.cos(a)*innerR)
      .attr("x2",Math.sin(a)*(maxR+5)).attr("y2",-Math.cos(a)*(maxR+5))
      .attr("stroke","#21262d").attr("stroke-width",0.5);
  });

  // Center
  g.append("text").attr("text-anchor","middle").attr("dy","-.2em")
    .attr("fill","#58a6ff").attr("font-size","11px").attr("font-weight","bold").text("Loudness");
  g.append("text").attr("text-anchor","middle").attr("dy","1.2em")
    .attr("fill","#8b949e").attr("font-size","9px").text("by key");

  // Legend
  const leg = d3.select("#legend");
  loudBins.forEach((b,i) => {
    leg.append("span").html(`<span class="lswatch" style="background:${binColors[i]}"></span> ${b}`);
  });
});
</script>
</body>
</html>
