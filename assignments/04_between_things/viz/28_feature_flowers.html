<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>28 — Audio Feature Flowers</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: "Helvetica Neue", sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
  h1 { font-size: 1.6rem; color: #58a6ff; margin-bottom: .2rem; }
  p.sub { color: #8b949e; font-size: .85rem; margin-bottom: 1.2rem; max-width: 700px; text-align: center; }
  svg { background: #161b22; border-radius: 12px; }
  .tooltip { position: absolute; background: #1c2128ee; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; font-size: .75rem; color: #c9d1d9; pointer-events: none; opacity: 0; line-height: 1.6; }
  a.back { color: #58a6ff; font-size: .8rem; margin-bottom: 1rem; text-decoration: none; }
  .feat-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; font-size: .72rem; color: #8b949e; }
  .feat-legend span { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<a class="back" href="index.html">← all visualizations</a>
<h1>🌸 Audio Feature Flowers</h1>
<p class="sub">Every musical key blooms into a flower. Each of the 7 petals represents an audio feature — the longer the petal, the stronger that trait. Arranged like a clock face, rooted in the circle of keys. Hover a flower to inspect its DNA.</p>
<div id="chart"></div>
<div class="feat-legend" id="featLeg"></div>
<div class="tooltip" id="tip"></div>
<script>
const W = 800, H = 800, cx = W/2, cy = H/2;
const orbitR = 270, petalMax = 70;
const feats = ["danceability","energy","speechiness","acousticness","instrumentalness","liveness","valence"];
const petalColors = ["#ff6b9d","#ff6b35","#ffd166","#06d6a0","#118ab2","#ef476f","#ffd700"];
const petalLabels = ["Dance","Energy","Speech","Acoustic","Instr.","Live","Valence"];

const svg = d3.select("#chart").append("svg").attr("width",W).attr("height",H);
const defs = svg.append("defs");
const filt = defs.append("filter").attr("id","glow");
filt.append("feGaussianBlur").attr("stdDeviation",2.5).attr("result","b");
const fm = filt.append("feMerge"); fm.append("feMergeNode").attr("in","b"); fm.append("feMergeNode").attr("in","SourceGraphic");

const tip = d3.select("#tip");

function petalPath(length, width) {
  const w = width || 8;
  return `M 0,0 C ${w},${-length*0.35} ${w*0.7},${-length*0.75} 0,${-length} C ${-w*0.7},${-length*0.75} ${-w},${-length*0.35} 0,0 Z`;
}

const keyHues = i => d3.hsl(i * 30, 0.7, 0.6).formatHex();

d3.json("data/key_features.json").then(data => {
  // Orbit circle (faint)
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",orbitR)
    .attr("fill","none").attr("stroke","#21262d").attr("stroke-dasharray","4,6");

  data.forEach(d => {
    const angle = (2*Math.PI/12) * d.key;
    const fx = cx + Math.sin(angle) * orbitR;
    const fy = cy - Math.cos(angle) * orbitR;
    const flowerG = svg.append("g").attr("transform",`translate(${fx},${fy})`);
    const baseColor = keyHues(d.key);

    // Draw petals
    feats.forEach((f, i) => {
      const pAngle = (360/7) * i;
      const len = 12 + d[f] * petalMax;
      flowerG.append("path")
        .attr("d", petalPath(len, 7 + d[f]*4))
        .attr("transform", `rotate(${pAngle})`)
        .attr("fill", petalColors[i])
        .attr("fill-opacity", 0.55)
        .attr("stroke", petalColors[i])
        .attr("stroke-width", 0.8)
        .attr("filter","url(#glow)");
    });

    // Center circle
    flowerG.append("circle").attr("r", 10)
      .attr("fill", baseColor).attr("stroke","#0d1117").attr("stroke-width",1.5);

    // Key label
    flowerG.append("text").attr("text-anchor","middle").attr("dy",".35em")
      .attr("fill","#0d1117").attr("font-size","8px").attr("font-weight","bold")
      .text(d.key_name.replace("/D♭","").replace("/E♭","").replace("/G♭","").replace("/A♭","").replace("/B♭",""));

    // Outer label
    const labelR = petalMax + 28;
    const lx = Math.sin(angle) * (orbitR + labelR - orbitR + 68);
    const ly = -Math.cos(angle) * (orbitR + labelR - orbitR + 68);
    // Use absolute position label
    svg.append("text")
      .attr("x", cx + Math.sin(angle)*(orbitR + 80))
      .attr("y", cy - Math.cos(angle)*(orbitR + 80))
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("fill","#8b949e").attr("font-size","11px")
      .text(d.key_name);

    // Hover area
    flowerG.append("circle").attr("r", petalMax + 10)
      .attr("fill","transparent").attr("cursor","pointer")
      .on("mouseover", e => {
        flowerG.selectAll("path").attr("fill-opacity",0.85);
        tip.style("opacity",1).html(
          `<b>${d.key_name}</b> — ${d3.format(",")(d.streams)} streams<br>`+
          feats.map((f,i) => `<span style="color:${petalColors[i]}">●</span> ${petalLabels[i]}: ${d[f].toFixed(3)}`).join("<br>"));
      })
      .on("mousemove",e=>tip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-20)+"px"))
      .on("mouseout",() => {
        flowerG.selectAll("path").attr("fill-opacity",0.55);
        tip.style("opacity",0);
      });
  });

  // Feature legend
  const fl = d3.select("#featLeg");
  feats.forEach((f,i) => {
    fl.append("span").html(`<span style="color:${petalColors[i]}">⬤</span> ${petalLabels[i]}`);
  });
});
</script>
</body>
</html>
