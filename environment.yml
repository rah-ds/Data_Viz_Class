name: data-viz
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # Core data science
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.14.0
  - bokeh>=3.1.0

  # Jupyter
  - jupyter>=1.0.0
  - jupyterlab>=4.0.0
  - ipython>=8.12.0
  - ipywidgets>=8.0.0

  # Data processing
  - scikit-learn>=1.2.0
  - statsmodels>=0.14.0

  # File I/O
  - openpyxl>=3.1.0
  - xlrd>=2.0.1
  - pyarrow>=11.0.0

  # Utilities
  - requests>=2.28.0
  - beautifulsoup4>=4.12.0
  - python-dotenv>=1.0.0
  - tqdm>=4.65.0

  # Code quality
  - black>=23.0.0
  - flake8>=6.0.0
  - isort>=5.12.0

  # Documentation
  - sphinx>=6.0.0
  - sphinx_rtd_theme>=1.2.0

  # R (optional, uncomment if needed)
  # - r-base>=4.2.0
  # - r-tidyverse>=2.0.0
  # - r-ggplot2>=3.4.0
  # - r-dplyr>=1.1.0
  # - r-here>=1.0.0
  # - r-rmarkdown>=2.20.0

  # Pip packages (if not available in conda)
  - pip
